name: "Build & Push"
on:
  workflow_dispatch:
    inputs:
      image_tag_version:
        description: "Image tag versions (comma-separated)"
        required: true
        default: latest

jobs:
  build-push:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG_BASE: "ghcr.io/david-lor/tor-privoxy"
    permissions:
      packages: write
      contents: read

    steps:
      # Setup
      - name: "Checkout"
        uses: actions/checkout@master
        with:
          fetch-depth: 1

      # Registry login
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Build & Push
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v1
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v1
      - name: "Process image tags"
        run: |
          IMAGE_TAG_FULL_LIST=""
          for image_tag_version in $(echo "${{ github.event.inputs.image_tag_version }}" | sed "s/,/ /g")
          do
            IMAGE_TAG_FULL="${{ env.IMAGE_TAG_BASE }}:$image_tag_version"
            IMAGE_TAG_FULL_LIST="${IMAGE_TAG_FULL_LIST:+$IMAGE_TAG_FULL_LIST,}$IMAGE_TAG_FULL"
          done
          echo "IMAGE_TAG_FULL_LIST=$IMAGE_TAG_FULL_LIST" >> "$GITHUB_ENV"
      - name: "Build and push"
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: ${{ env.IMAGE_TAG_FULL_LIST }}
